# ==========================================================
# MOBI ARMY 2 HYBRID SERVER CONFIGURATION
# ==========================================================

# Port lắng nghe
server_port=8080

# Mật khẩu quản trị Admin Web Dashboard (http://<ip>:8080/admin)
admin_password=admin123

# Cấu hình quà tân thủ
starter_xu=50000
starter_luong=100
event_exp_rate=1.0

# Loại cơ sở dữ liệu: mysql hoặc sqlite
db_type=mysql

# Cấu hình kết nối MySQL / MariaDB / phpMyAdmin
db_host=127.0.0.1
db_port=3306
db_name=army2_db
db_user=root
db_password=
